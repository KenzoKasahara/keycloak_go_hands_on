<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>documentsテーブルに対して、aliceとbobがそれぞれ取得できる範囲</title>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="admin" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <symbol id="page" viewBox="0 0 30 38">
      <path d="M2,2 H20 L28,10 V36 H2 Z" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20,2 V10 H28" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <path d="M7,17 H23 M7,23 H23 M7,29 H17" stroke="#94a3b8" stroke-width="2"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">一覧は本人の文書だけ。他者の文書は admin の個別取得だけ</text>

  <!-- DB -->
  <path d="M370,98 V430 A110,18 0 0 0 590,430 V98" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="480" cy="98" rx="110" ry="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="104" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">documents テーブル</text>

  <!-- doc 1 -->
  <rect x="390" y="140" width="180" height="84" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <use href="#page" x="402" y="160" width="30" height="38"/>
  <text x="444" y="176" font-size="17" font-weight="700" fill="#0f172a">id=1</text>
  <text x="444" y="200" font-size="13" fill="#475569">owner =</text>
  <text x="444" y="216" font-size="13" fill="#475569">aliceのsub</text>

  <!-- doc 2 -->
  <rect x="390" y="300" width="180" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <use href="#page" x="402" y="320" width="30" height="38"/>
  <text x="444" y="336" font-size="17" font-weight="700" fill="#0f172a">id=2</text>
  <text x="444" y="360" font-size="13" fill="#475569">owner =</text>
  <text x="444" y="376" font-size="13" fill="#475569">bobのsub</text>

  <!-- alice -->
  <g transform="translate(90,182)">
    <circle r="54" fill="#fef9c3"/>
    <circle cy="-16" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <path d="M-30,32 Q-30,4 0,4 Q30,4 30,32 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <path d="M-14,-38 L-14,-50 L-7,-43 L0,-54 L7,-43 L14,-50 L14,-38 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <text y="78" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">alice</text>
    <rect x="-34" y="88" width="68" height="24" rx="12" fill="#ffedd5" stroke="#d97706"/>
    <text y="105" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">admin</text>
  </g>

  <!-- bob -->
  <g transform="translate(870,342)">
    <circle r="54" fill="#ede9fe"/>
    <circle cy="-16" r="18" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/>
    <path d="M-30,32 Q-30,4 0,4 Q30,4 30,32 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/>
    <text y="-70" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">bob</text>
    <rect x="-30" y="62" width="60" height="24" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text y="79" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">user</text>
  </g>

  <!-- alice -> doc1 -->
  <path d="M150,170 L384,170" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <text x="266" y="158" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">一覧・個別</text>
  <g transform="translate(266,186)"><rect x="-30" y="-1" width="60" height="24" rx="12" fill="#dcfce7" stroke="#16a34a"/><text y="16" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">200</text></g>

  <!-- alice -> doc2 (admin exception) -->
  <path d="M146,214 L384,318" stroke="#d97706" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#admin)"/>
  <g transform="translate(230,300)">
    <rect x="-96" y="-14" width="192" height="50" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text y="4" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">個別取得のみ 200</text>
    <text y="24" font-size="13" fill="#b45309" text-anchor="middle">（adminの例外）</text>
  </g>

  <!-- bob -> doc2 -->
  <path d="M810,342 L576,342" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <text x="694" y="330" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">一覧・個別</text>
  <g transform="translate(694,358)"><rect x="-30" y="-1" width="60" height="24" rx="12" fill="#dcfce7" stroke="#16a34a"/><text y="16" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">200</text></g>

  <!-- bob -x doc1 -->
  <path d="M814,300 L640,206" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <g transform="translate(620,196)">
    <circle r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(754,214)">
    <rect x="-82" y="-14" width="164" height="50" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text y="4" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">個別取得は 404</text>
    <text y="24" font-size="13" fill="#b91c1c" text-anchor="middle">存在も伝えない</text>
  </g>
</svg>
