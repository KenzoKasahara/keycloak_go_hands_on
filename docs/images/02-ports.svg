<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>ホストのブラウザ・curlから127.0.0.1の5ポートで確認する。9080はkeycloakのDiscoveryと/admin/、9081はweb-a、9082はweb-bのログインリンク、9001はapi-a、9002はapi-bの/healthzが200。postgresはkeycloakとapi-bだけが使い、ホストには公開しない</title>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <symbol id="window" viewBox="0 0 48 40">
      <rect x="1.5" y="1.5" width="45" height="37" rx="4" fill="#ffffff" stroke-width="2.5"/>
      <path d="M1.5,12 H46.5" stroke-width="2.5" fill="none"/>
      <circle cx="8" cy="7" r="1.8" stroke="none"/><circle cx="14" cy="7" r="1.8" stroke="none"/><circle cx="20" cy="7" r="1.8" stroke="none"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 40 48">
      <path d="M20,2 L38,9 V24 Q38,40 20,46 Q2,40 2,24 V9 Z" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="20" cy="20" r="5" fill="#ffffff" stroke="none"/>
      <path d="M17,23 H23 L22,33 H18 Z" fill="#ffffff" stroke="none"/>
    </symbol>
    <symbol id="server" viewBox="0 0 40 56">
      <rect x="0" y="0" width="40" height="16" rx="3"/>
      <rect x="0" y="20" width="40" height="16" rx="3"/>
      <rect x="0" y="40" width="40" height="16" rx="3"/>
      <circle cx="32" cy="8" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="28" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="48" r="2.5" fill="#ffffff" opacity="0.7"/>
    </symbol>
    <symbol id="db" viewBox="0 0 40 48">
      <path d="M2,8 V40 A18,6 0 0 0 38,40 V8" stroke-width="2"/>
      <ellipse cx="20" cy="8" rx="18" ry="6" stroke-width="2"/>
      <path d="M2,20 A18,6 0 0 0 38,20 M2,30 A18,6 0 0 0 38,30" fill="none" stroke-width="1.5"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">ホストから見える入口は 127.0.0.1 の5ポートだけ</text>

  <!-- Host -->
  <rect x="24" y="170" width="168" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(78,184)">
    <rect x="0" y="0" width="60" height="38" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <path d="M-8,44 H68 L62,38 H-2 Z" fill="#475569"/>
    <path d="M10,14 L17,19 L10,24 M22,26 H32" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="108" y="250" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ホスト</text>
  <text x="108" y="268" font-size="12" fill="#475569" text-anchor="middle">ブラウザ・curl</text>

  <!-- Docker area -->
  <rect x="300" y="70" width="628" height="330" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="920" y="94" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">Docker Compose</text>

  <!-- fan lines -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M196,215 L266,112"/>
    <path d="M196,220 L266,168"/>
    <path d="M196,225 L266,224"/>
    <path d="M196,230 L266,280"/>
    <path d="M196,235 L266,336"/>
  </g>

  <!-- port pills -->
  <g font-size="13" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#ffffff" text-anchor="middle">
    <rect x="268" y="100" width="64" height="24" rx="12" fill="#7c3aed"/><text x="300" y="117">9080</text>
    <rect x="268" y="156" width="64" height="24" rx="12" fill="#2563eb"/><text x="300" y="173">9081</text>
    <rect x="268" y="212" width="64" height="24" rx="12" fill="#059669"/><text x="300" y="229">9082</text>
    <rect x="268" y="268" width="64" height="24" rx="12" fill="#2563eb"/><text x="300" y="285">9001</text>
    <rect x="268" y="324" width="64" height="24" rx="12" fill="#059669"/><text x="300" y="341">9002</text>
  </g>

  <!-- services -->
  <g>
    <rect x="344" y="90" width="290" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <use href="#shield" x="356" y="96" width="26" height="32" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="394" y="118" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#4c1d95">keycloak</text>
    <text x="486" y="118" font-size="13" fill="#475569">Discovery・/admin/</text>

    <rect x="344" y="146" width="290" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <use href="#window" x="354" y="155" width="30" height="25" fill="#2563eb" stroke="#2563eb"/>
    <text x="394" y="174" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#1e3a8a">web-a</text>
    <text x="486" y="174" font-size="13" fill="#475569">ログインリンク</text>

    <rect x="344" y="202" width="290" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <use href="#window" x="354" y="211" width="30" height="25" fill="#059669" stroke="#059669"/>
    <text x="394" y="230" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#064e3b">web-b</text>
    <text x="486" y="230" font-size="13" fill="#475569">ログインリンク</text>

    <rect x="344" y="258" width="290" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <use href="#server" x="360" y="264" width="23" height="32" fill="#2563eb"/>
    <text x="394" y="286" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#1e3a8a">api-a</text>
    <text x="486" y="286" font-size="13" fill="#475569">/healthz →</text>
    <rect x="566" y="270" width="48" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
    <text x="590" y="286" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">200</text>

    <rect x="344" y="314" width="290" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <use href="#server" x="360" y="320" width="23" height="32" fill="#059669"/>
    <text x="394" y="342" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#064e3b">api-b</text>
    <text x="486" y="342" font-size="13" fill="#475569">/healthz →</text>
    <rect x="566" y="326" width="48" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
    <text x="590" y="342" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">200</text>
  </g>

  <!-- postgres -->
  <rect x="724" y="160" width="180" height="140" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <use href="#db" x="792" y="174" width="40" height="48" fill="#e2e8f0" stroke="#475569"/>
  <g transform="translate(838,214)">
    <rect x="-9" y="-4" width="18" height="14" rx="2" fill="#dc2626"/>
    <path d="M-5,-4 V-8 A5,5 0 0 1 5,-8 V-4" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  </g>
  <text x="814" y="250" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#334155" text-anchor="middle">postgres</text>
  <text x="814" y="272" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">非公開</text>
  <text x="814" y="290" font-size="11" fill="#64748b" text-anchor="middle">ホストにポートを出さない</text>
  <path d="M638,112 L720,190" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <path d="M638,336 L720,270" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
</svg>
