<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>API Aはメモリに公開鍵があり、Keycloak停止中でも200。再起動したAPI Bはメモリが空で、停止中のKeycloakから公開鍵を取得できず401</title>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ng" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <symbol id="ticket" viewBox="0 0 220 80">
      <path d="M10,0 H210 A10,10 0 0 1 220,10 V30 A10,10 0 0 0 220,50 V70 A10,10 0 0 1 210,80 H10 A10,10 0 0 1 0,70 V50 A10,10 0 0 0 0,30 V10 A10,10 0 0 1 10,0 Z"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 40 48">
      <path d="M20,2 L38,9 V24 Q38,40 20,46 Q2,40 2,24 V9 Z" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="20" cy="20" r="5" fill="#ffffff" stroke="none"/>
      <path d="M17,23 H23 L22,33 H18 Z" fill="#ffffff" stroke="none"/>
    </symbol>
    <symbol id="server" viewBox="0 0 40 56">
      <rect x="0" y="0" width="40" height="16" rx="3"/>
      <rect x="0" y="20" width="40" height="16" rx="3"/>
      <rect x="0" y="40" width="40" height="16" rx="3"/>
      <circle cx="32" cy="8" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="28" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="48" r="2.5" fill="#ffffff" opacity="0.7"/>
    </symbol>
    <symbol id="key" viewBox="0 0 40 20">
      <circle cx="9" cy="10" r="6.5" fill="none" stroke-width="3"/>
      <path d="M15.5,10 H38 M30,10 V17 M36,10 V16" fill="none" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="499" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">API A と API B の違いは、メモリに公開鍵があるかどうかだけ</text>

  <!-- token -->
  <use href="#ticket" x="32" y="210" width="200" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="68" y1="216" x2="68" y2="284" stroke="#2563eb" stroke-dasharray="4 4"/>
  <g stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"><circle cx="50" cy="250" r="6"/><path d="M56,250 H65 M61,250 v5 M65,250 v5"/></g>
  <text x="80" y="244" font-size="15" font-weight="700" fill="#1e3a8a">alice の token</text>
  <text x="80" y="268" font-size="13" fill="#475569">期限内の JWT</text>

  <path d="M236,236 L314,160" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <path d="M236,264 L314,340" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>

  <!-- API A (warm) -->
  <rect x="320" y="80" width="300" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <use href="#server" x="340" y="96" width="34" height="48" fill="#2563eb"/>
  <text x="388" y="116" font-size="18" font-weight="700" fill="#1e3a8a">API A</text>
  <text x="388" y="138" font-size="13" fill="#475569">再起動しない</text>
  <rect x="338" y="158" width="266" height="46" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <use href="#key" x="352" y="171" width="40" height="20" stroke="#16a34a"/>
  <text x="404" y="186" font-size="14" font-weight="700" fill="#166534">メモリ：公開鍵あり（warm）</text>

  <!-- API B (cold) -->
  <rect x="320" y="280" width="300" height="140" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <use href="#server" x="340" y="296" width="34" height="48" fill="#059669"/>
  <text x="388" y="316" font-size="18" font-weight="700" fill="#064e3b">API B</text>
  <text x="388" y="338" font-size="13" fill="#475569">Keycloak 停止後に再起動</text>
  <rect x="338" y="358" width="266" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <rect x="352" y="370" width="40" height="22" rx="4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="404" y="386" font-size="14" font-weight="700" fill="#64748b">メモリ：空（cold）</text>

  <!-- A result -->
  <path d="M624,150 L700,150" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <g transform="translate(750,150)">
    <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M-28,0 l6,6 l11,-12" stroke="#16a34a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="6" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">200</text>
  </g>
  <text x="808" y="146" font-size="13" fill="#0f172a">手元の鍵で検証</text>
  <text x="808" y="166" font-size="13" fill="#64748b">Keycloak へ</text>
  <text x="808" y="184" font-size="13" fill="#64748b">問い合わせない</text>

  <!-- B -> Keycloak -->
  <path d="M624,350 L770,350" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#ng)"/>
  <text x="697" y="334" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">JWKS を取得</text>
  <g transform="translate(697,350)">
    <circle r="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Keycloak (stopped) -->
  <rect x="776" y="296" width="152" height="108" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <use href="#shield" x="832" y="306" width="40" height="48" fill="#cbd5e1" stroke="#64748b"/>
  <text x="852" y="374" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Keycloak</text>
  <text x="852" y="394" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">停止中</text>
  <g transform="translate(926,298)">
    <circle r="14" fill="#dc2626"/>
    <path d="M-5.5,-5.5 L5.5,5.5 M5.5,-5.5 L-5.5,5.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- B result -->
  <path d="M470,422 L470,440" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#ng)"/>
  <g transform="translate(470,462)">
    <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M-30,-7 l12,12 M-18,-7 l-12,12" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <text x="12" y="6" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">401</text>
  </g>
  <text x="526" y="467" font-size="14" fill="#0f172a">鍵がないので署名を検証できず拒否</text>
</svg>
