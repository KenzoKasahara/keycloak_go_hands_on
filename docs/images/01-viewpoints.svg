<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>観察表の7行は3つの観点に分かれる。認証はSSO（パスワード省略）とtoken共有（401）。認可はユーザー権限（403）とレコード権限（404）。可用性はwarm cache（200）、cold cache（401）、トークン更新（失敗）</title>
  <defs>
    <symbol id="key" viewBox="0 0 40 20">
      <circle cx="9" cy="10" r="6.5" fill="none" stroke-width="3"/>
      <path d="M15.5,10 H38 M30,10 V17 M36,10 V16" fill="none" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">観察表の7行は3つの観点に分かれる。似ている2つを混同しない</text>

  <!-- ===== 認証 ===== -->
  <rect x="32" y="70" width="288" height="306" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <g transform="translate(62,104)">
    <circle r="20" fill="#2563eb"/>
    <use href="#key" x="-13" y="-6.5" width="26" height="13" stroke="#ffffff"/>
  </g>
  <text x="94" y="100" font-size="17" font-weight="700" fill="#1e3a8a">認証</text>
  <text x="94" y="120" font-size="12" fill="#475569">ログインを共有できるか</text>

  <rect x="46" y="146" width="260" height="62" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="60" y="172" font-size="15" font-weight="700" fill="#0f172a">SSO</text>
  <text x="60" y="194" font-size="13" fill="#64748b">A→B でパスワード省略</text>
  <g transform="translate(266,177)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text y="5" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">入力なし</text>
  </g>

  <path d="M60,226 H140 M212,226 H292" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="146" y="214" width="60" height="24" rx="12" fill="#2563eb"/>
  <text x="176" y="231" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">別物</text>

  <rect x="46" y="244" width="260" height="62" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="60" y="270" font-size="15" font-weight="700" fill="#0f172a">token 共有</text>
  <text x="60" y="292" font-size="13" fill="#64748b">A の token → API B</text>
  <g transform="translate(266,275)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text y="5" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">401</text>
  </g>
  <text x="176" y="346" font-size="12" fill="#1e3a8a" text-anchor="middle">ログインは共有しても</text>
  <text x="176" y="364" font-size="12" fill="#1e3a8a" text-anchor="middle">token はアプリごとに別</text>

  <!-- ===== 認可 ===== -->
  <rect x="336" y="70" width="288" height="306" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <g transform="translate(366,104)">
    <circle r="20" fill="#d97706"/>
    <rect x="-9" y="-3" width="18" height="14" rx="2" fill="#ffffff"/>
    <path d="M-5,-3 V-8 A5,5 0 0 1 5,-8 V-3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <text x="398" y="100" font-size="17" font-weight="700" fill="#92400e">認可</text>
  <text x="398" y="120" font-size="12" fill="#475569">何をしてよいか</text>

  <rect x="350" y="146" width="260" height="62" rx="10" fill="#ffffff" stroke="#fde68a"/>
  <text x="364" y="172" font-size="15" font-weight="700" fill="#0f172a">ユーザー権限</text>
  <text x="364" y="194" font-size="13" fill="#64748b">bob → 管理API</text>
  <g transform="translate(570,177)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text y="5" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">403</text>
  </g>

  <path d="M364,226 H444 M516,226 H596" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="450" y="214" width="60" height="24" rx="12" fill="#d97706"/>
  <text x="480" y="231" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">別物</text>

  <rect x="350" y="244" width="260" height="62" rx="10" fill="#ffffff" stroke="#fde68a"/>
  <text x="364" y="270" font-size="15" font-weight="700" fill="#0f172a">レコード権限</text>
  <text x="364" y="292" font-size="13" fill="#64748b">bob → alice の文書</text>
  <g transform="translate(570,275)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text y="5" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">404</text>
  </g>
  <text x="480" y="346" font-size="12" fill="#92400e" text-anchor="middle">ロールで決まる権限と</text>
  <text x="480" y="364" font-size="12" fill="#92400e" text-anchor="middle">データの持ち主で決まる権限</text>

  <!-- ===== 可用性 ===== -->
  <rect x="640" y="70" width="288" height="306" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <g transform="translate(670,104)">
    <circle r="20" fill="#dc2626"/>
    <path d="M-12,1 H-6 L-2,-8 L3,9 L7,1 H12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="702" y="100" font-size="17" font-weight="700" fill="#991b1b">可用性</text>
  <text x="702" y="120" font-size="12" fill="#475569">IdP 停止で何が止まるか</text>

  <rect x="654" y="146" width="260" height="62" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="668" y="172" font-size="15" font-weight="700" fill="#0f172a">warm cache</text>
  <text x="668" y="194" font-size="13" fill="#64748b">期限内の JWT</text>
  <g transform="translate(874,177)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text y="5" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">200</text>
  </g>

  <rect x="654" y="218" width="260" height="62" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="668" y="244" font-size="15" font-weight="700" fill="#0f172a">cold cache</text>
  <text x="668" y="266" font-size="13" fill="#64748b">公開鍵を取得できない</text>
  <g transform="translate(874,249)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text y="5" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">401</text>
  </g>

  <rect x="654" y="290" width="260" height="62" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="668" y="316" font-size="15" font-weight="700" fill="#0f172a">トークン更新</text>
  <text x="668" y="338" font-size="13" fill="#64748b">IdP に到達できない</text>
  <g transform="translate(874,321)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text y="5" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">失敗</text>
  </g>
</svg>
