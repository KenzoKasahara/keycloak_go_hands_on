<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>docker compose down --volumesで消えるのは6サービスのコンテナ、ネットワーク、DB Volume（pg-data）、アプリのメモリセッション。手動で消すのは.envとgenerated/、ダウンロードしたtoken、ブラウザの127.0.0.1のサイトデータ。残るのはイメージ、ビルドキャッシュ、Goモジュールキャッシュで、必要なものだけ個別に削除する</title>
  <defs>
    <symbol id="trash" viewBox="0 0 32 36">
      <path d="M3,8 H29 M12,8 V4 H20 V8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6,8 L8,33 H24 L26,8" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M13,14 V27 M19,14 V27" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">片付けの範囲：コマンドで消えるもの、手で消すもの、残るもの</text>

  <!-- col 1 -->
  <rect x="32" y="70" width="288" height="266" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <g transform="translate(66,106)">
    <circle r="22" fill="#16a34a"/>
    <use href="#trash" x="-11" y="-13" width="22" height="25" stroke="#ffffff"/>
  </g>
  <text x="100" y="102" font-size="15" font-weight="700" fill="#166534">コマンドで消える</text>
  <text x="100" y="122" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#475569">down --volumes</text>
  <g font-size="14" fill="#0f172a">
    <rect x="48" y="146" width="256" height="38" rx="8" fill="#ffffff" stroke="#bbf7d0"/><text x="62" y="170">6サービスのコンテナ</text>
    <rect x="48" y="190" width="256" height="38" rx="8" fill="#ffffff" stroke="#bbf7d0"/><text x="62" y="214">ネットワーク</text>
    <rect x="48" y="234" width="256" height="38" rx="8" fill="#ffffff" stroke="#bbf7d0"/><text x="62" y="258">DB Volume（pg-data）</text>
    <rect x="48" y="278" width="256" height="38" rx="8" fill="#ffffff" stroke="#bbf7d0"/><text x="62" y="302">アプリのメモリセッション</text>
  </g>

  <!-- col 2 -->
  <rect x="336" y="70" width="288" height="266" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <g transform="translate(370,106)">
    <circle r="22" fill="#d97706"/>
    <path d="M-8,10 V-4 A2.5,2.5 0 0 1 -3,-4 V-12 A2.5,2.5 0 0 1 2,-12 V-4 M2,-10 A2.5,2.5 0 0 1 7,-10 V-1 M7,-6 A2.5,2.5 0 0 1 12,-6 V4 Q12,14 2,14 H-2 Q-6,14 -9,9 L-14,1 A2.5,2.5 0 0 1 -10,-2 L-8,1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="404" y="102" font-size="15" font-weight="700" fill="#92400e">手動で消す</text>
  <text x="404" y="122" font-size="12" fill="#475569">コマンドでは消えない</text>
  <g font-size="14" fill="#0f172a">
    <rect x="352" y="146" width="256" height="38" rx="8" fill="#ffffff" stroke="#fde68a"/><text x="366" y="170" font-family="Consolas,'Courier New',monospace">.env</text><text x="408" y="170">と</text><text x="428" y="170" font-family="Consolas,'Courier New',monospace">generated/</text>
    <rect x="352" y="190" width="256" height="38" rx="8" fill="#ffffff" stroke="#fde68a"/><text x="366" y="214">ダウンロードした token</text>
    <rect x="352" y="234" width="256" height="60" rx="8" fill="#ffffff" stroke="#fde68a"/><text x="366" y="258">ブラウザの 127.0.0.1 の</text><text x="366" y="280">サイトデータ</text>
  </g>

  <!-- col 3 -->
  <rect x="640" y="70" width="288" height="266" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g transform="translate(674,106)">
    <circle r="22" fill="#64748b"/>
    <path d="M-12,-5 L0,-11 L12,-5 V8 L0,14 L-12,8 Z M-12,-5 L0,1 L12,-5 M0,1 V14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="708" y="102" font-size="15" font-weight="700" fill="#334155">残る</text>
  <text x="708" y="122" font-size="12" fill="#475569">必要なものだけ個別に削除</text>
  <g font-size="14" fill="#0f172a">
    <rect x="656" y="146" width="256" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="670" y="170">イメージ</text>
    <rect x="656" y="190" width="256" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="670" y="214">ビルドキャッシュ</text>
    <rect x="656" y="234" width="256" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="670" y="258">Go モジュールキャッシュ</text>
  </g>
</svg>
