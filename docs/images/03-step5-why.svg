<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>seed.pyはAPI Bが検証したsubだけを所有者としてDBへ書き込む</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="519" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">DBに書くsubは、APIが検証した値だけ</text>

  <!-- lifelines -->
  <path d="M150,150 V490 M480,150 V490 M810,150 V490" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- seed.py -->
  <g transform="translate(150,104)">
    <rect x="-80" y="-36" width="160" height="72" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <path d="M-60,-20 H-36 L-28,-12 V20 H-60 Z" fill="#fde68a" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <text x="-44" y="10" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">py</text>
    <text x="22" y="7" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">seed.py</text>
  </g>
  <!-- API B -->
  <g transform="translate(480,104)">
    <rect x="-80" y="-36" width="160" height="72" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="-62" y="-22" width="34" height="12" rx="2" fill="#059669"/><rect x="-62" y="-6" width="34" height="12" rx="2" fill="#059669"/><rect x="-62" y="10" width="34" height="12" rx="2" fill="#059669"/>
    <text x="22" y="7" font-size="17" font-weight="700" fill="#064e3b" text-anchor="middle">API B</text>
  </g>
  <!-- app DB -->
  <g transform="translate(810,104)">
    <rect x="-90" y="-36" width="180" height="72" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M-66,-16 V16 A16,6 0 0 0 -34,16 V-16" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <ellipse cx="-50" cy="-16" rx="16" ry="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="22" y="2" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">app DB</text>
    <text x="22" y="22" font-size="12" fill="#6d28d9" text-anchor="middle">psql</text>
  </g>

  <!-- helper: numbered circle -->
  <!-- 1 -->
  <path d="M154,184 L472,184" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <circle cx="178" cy="170" r="12" fill="#334155"/><text x="178" y="175" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="198" y="175" font-size="13" fill="#0f172a">GET /api/me（alice-b.token、bob-b.token）</text>

  <!-- 2 -->
  <g transform="translate(480,232)">
    <rect x="-150" y="-22" width="300" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <path d="M-128,-12 L-114,-16 L-100,-12 V0 Q-100,10 -114,16 Q-128,10 -128,0 Z" fill="#059669"/>
    <path d="M-120,0 l4,4 l8,-9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-82" cy="0" r="12" fill="#334155"/><text x="-82" y="5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="22" y="5" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">署名とclaimsを検証</text>
  </g>

  <!-- 3 -->
  <path d="M476,286 L158,286" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
  <circle cx="452" cy="272" r="12" fill="#16a34a"/><text x="452" y="277" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="432" y="277" font-size="14" fill="#15803d" text-anchor="end" font-weight="700">検証済みのsub（aliceとbob）</text>

  <!-- 4 -->
  <g transform="translate(150,334)">
    <rect x="-130" y="-22" width="260" height="44" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="-108" cy="0" r="12" fill="#334155"/><text x="-108" y="5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="10" y="5" font-size="14" fill="#0f172a" text-anchor="middle">2つのsubが異なることを確認</text>
  </g>

  <!-- 5 -->
  <path d="M154,398 L802,398" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#db)"/>
  <circle cx="300" cy="384" r="12" fill="#7c3aed"/><text x="300" y="389" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="320" y="389" font-size="14" fill="#4c1d95">既存の文書を TRUNCATE</text>

  <!-- 6 -->
  <path d="M154,458 L802,458" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#db)"/>
  <circle cx="300" cy="444" r="12" fill="#7c3aed"/><text x="300" y="449" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="320" y="449" font-size="14" fill="#4c1d95">id=1 を aliceのsub、id=2 を bobのsub で登録</text>
</svg>
