<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>同じブラウザがWeb App A（9081）、Web App B（9082）、Keycloak（9080）に接続する。WebはKeycloakとCode + PKCEでtokenを得て、aud api-aはGo API A（9001）、aud api-bはGo API B（9002）へ送る。両APIはKeycloakから公開鍵を取得する。KeycloakはDB keycloak、API BはDB appを使い、どちらも同一PostgreSQLインスタンスにある</title>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <symbol id="shield" viewBox="0 0 40 48">
      <path d="M20,2 L38,9 V24 Q38,40 20,46 Q2,40 2,24 V9 Z" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="20" cy="20" r="5" fill="#ffffff" stroke="none"/>
      <path d="M17,23 H23 L22,33 H18 Z" fill="#ffffff" stroke="none"/>
    </symbol>
    <symbol id="server" viewBox="0 0 40 56">
      <rect x="0" y="0" width="40" height="16" rx="3"/>
      <rect x="0" y="20" width="40" height="16" rx="3"/>
      <rect x="0" y="40" width="40" height="16" rx="3"/>
      <circle cx="32" cy="8" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="28" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="48" r="2.5" fill="#ffffff" opacity="0.7"/>
    </symbol>
    <symbol id="window" viewBox="0 0 48 40">
      <rect x="1.5" y="1.5" width="45" height="37" rx="4" fill="#ffffff" stroke-width="2.5"/>
      <path d="M1.5,12 H46.5" stroke-width="2.5" fill="none"/>
      <circle cx="8" cy="7" r="1.8" stroke="none"/><circle cx="14" cy="7" r="1.8" stroke="none"/><circle cx="20" cy="7" r="1.8" stroke="none"/>
    </symbol>
    <symbol id="person" viewBox="0 0 40 40">
      <circle cx="20" cy="12" r="8" stroke-width="2"/>
      <path d="M6,38 Q6,22 20,22 Q34,22 34,38 Z" stroke-width="2"/>
    </symbol>
    <symbol id="db" viewBox="0 0 40 48">
      <path d="M2,8 V40 A18,6 0 0 0 38,40 V8" stroke-width="2"/>
      <ellipse cx="20" cy="8" rx="18" ry="6" stroke-width="2"/>
      <path d="M2,20 A18,6 0 0 0 38,20 M2,30 A18,6 0 0 0 38,30" fill="none" stroke-width="1.5"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="589" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">6サービスの構成：Keycloak を 2つの Web と 2つの API が共有する</text>

  <!-- Browser -->
  <rect x="24" y="258" width="144" height="104" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <use href="#window" x="38" y="274" width="44" height="37" fill="#475569" stroke="#475569"/>
  <use href="#person" x="98" y="272" width="40" height="40" fill="#fbbf24" stroke="#b45309"/>
  <text x="96" y="334" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ブラウザ</text>
  <text x="96" y="352" font-size="12" fill="#475569" text-anchor="middle">同じプロファイル</text>

  <!-- Web A -->
  <rect x="290" y="90" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <use href="#window" x="304" y="112" width="40" height="34" fill="#2563eb" stroke="#2563eb"/>
  <text x="356" y="124" font-size="16" font-weight="700" fill="#1e3a8a">Web App A</text>
  <text x="356" y="146" font-size="12" fill="#475569">web-a・9081</text>

  <!-- Keycloak -->
  <rect x="290" y="270" width="180" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <use href="#shield" x="304" y="288" width="34" height="42" fill="#7c3aed" stroke="#5b21b6"/>
  <text x="350" y="298" font-size="16" font-weight="700" fill="#4c1d95">Keycloak</text>
  <text x="350" y="318" font-size="12" fill="#475569">Realm sso-lab</text>
  <text x="350" y="336" font-size="12" fill="#475569">9080</text>

  <!-- Web B -->
  <rect x="290" y="470" width="180" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <use href="#window" x="304" y="492" width="40" height="34" fill="#059669" stroke="#059669"/>
  <text x="356" y="504" font-size="16" font-weight="700" fill="#064e3b">Web App B</text>
  <text x="356" y="526" font-size="12" fill="#475569">web-b・9082</text>

  <!-- API A -->
  <rect x="600" y="90" width="170" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <use href="#server" x="614" y="106" width="34" height="48" fill="#2563eb"/>
  <text x="660" y="124" font-size="16" font-weight="700" fill="#1e3a8a">Go API A</text>
  <text x="660" y="146" font-size="12" fill="#475569">api-a・9001</text>

  <!-- API B -->
  <rect x="600" y="470" width="170" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <use href="#server" x="614" y="486" width="34" height="48" fill="#059669"/>
  <text x="660" y="504" font-size="16" font-weight="700" fill="#064e3b">Go API B</text>
  <text x="660" y="526" font-size="12" fill="#475569">api-b・9002</text>

  <!-- PostgreSQL -->
  <rect x="806" y="230" width="136" height="330" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="874" y="256" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">PostgreSQL</text>
  <text x="874" y="274" font-size="12" fill="#64748b" text-anchor="middle">同一インスタンス</text>
  <use href="#db" x="852" y="288" width="44" height="52" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="874" y="360" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">DB keycloak</text>
  <text x="874" y="378" font-size="12" fill="#64748b" text-anchor="middle">Role keycloak</text>
  <use href="#db" x="852" y="412" width="44" height="52" fill="#d1fae5" stroke="#059669"/>
  <text x="874" y="484" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">DB app</text>
  <text x="874" y="502" font-size="12" fill="#64748b" text-anchor="middle">Role app</text>
  <text x="874" y="520" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#64748b" text-anchor="middle">documents</text>

  <!-- Browser -> Web A / KC / Web B -->
  <path d="M120,258 L284,154" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <rect x="145" y="193" width="116" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="203" y="209" font-size="12" fill="#334155" text-anchor="middle">9081・Cookie A</text>

  <path d="M172,310 L284,310" stroke="#64748b" stroke-width="2.5" fill="none" marker-start="url(#gray)" marker-end="url(#gray)"/>
  <rect x="170" y="276" width="116" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="228" y="292" font-size="12" fill="#334155" text-anchor="middle">9080・SSO Cookie</text>

  <path d="M120,362 L284,506" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <rect x="145" y="425" width="116" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="203" y="441" font-size="12" fill="#334155" text-anchor="middle">9082・Cookie B</text>

  <!-- Web <-> KC -->
  <path d="M380,176 L380,264" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-start="url(#purple)" marker-end="url(#purple)"/>
  <text x="392" y="214" font-size="12" fill="#5b21b6">Code + PKCE</text>
  <text x="392" y="230" font-size="12" fill="#5b21b6">token・JWKS</text>
  <path d="M380,356 L380,464" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-start="url(#purple)" marker-end="url(#purple)"/>
  <text x="392" y="404" font-size="12" fill="#5b21b6">Code + PKCE</text>
  <text x="392" y="420" font-size="12" fill="#5b21b6">token・JWKS</text>

  <!-- Web -> API -->
  <path d="M474,130 L594,130" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <text x="534" y="120" font-size="12" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#1d4ed8" text-anchor="middle">aud api-a</text>
  <path d="M474,510 L594,510" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <text x="534" y="500" font-size="12" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#047857" text-anchor="middle">aud api-b</text>

  <!-- API -> KC (public key) -->
  <path d="M640,174 L478,284" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#purple)"/>
  <text x="566" y="242" font-size="12" fill="#5b21b6">公開鍵を取得</text>
  <path d="M640,466 L478,338" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#purple)"/>
  <text x="574" y="398" font-size="12" fill="#5b21b6">公開鍵を取得</text>

  <!-- to DB -->
  <path d="M474,302 L846,314" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <path d="M774,500 L846,446" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
</svg>
