<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>Keycloakは秘密鍵を外に出さず、JWTに署名する。APIは初回や未知のkidのときだけJWKSで公開鍵を取得してメモリにキャッシュし、Web Appから届いたJWTの署名を手元で検証する。リクエストごとにKeycloakへ問い合わせない。公開鍵は検証にしか使えず署名は作れないため、APIに配ってもトークンを偽造されない</title>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="light" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <symbol id="shield" viewBox="0 0 40 48">
      <path d="M20,2 L38,9 V24 Q38,40 20,46 Q2,40 2,24 V9 Z" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="20" cy="20" r="5" fill="#ffffff" stroke="none"/>
      <path d="M17,23 H23 L22,33 H18 Z" fill="#ffffff" stroke="none"/>
    </symbol>
    <symbol id="server" viewBox="0 0 40 56">
      <rect x="0" y="0" width="40" height="16" rx="3"/>
      <rect x="0" y="20" width="40" height="16" rx="3"/>
      <rect x="0" y="40" width="40" height="16" rx="3"/>
      <circle cx="32" cy="8" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="28" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="48" r="2.5" fill="#ffffff" opacity="0.7"/>
    </symbol>
    <symbol id="key" viewBox="0 0 40 20">
      <circle cx="9" cy="10" r="6.5" fill="none" stroke-width="3"/>
      <path d="M15.5,10 H38 M30,10 V17 M36,10 V16" fill="none" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="ticket" viewBox="0 0 220 80">
      <path d="M10,0 H210 A10,10 0 0 1 220,10 V30 A10,10 0 0 0 220,50 V70 A10,10 0 0 1 210,80 H10 A10,10 0 0 1 0,70 V50 A10,10 0 0 0 0,30 V10 A10,10 0 0 1 10,0 Z"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">API は公開鍵を手元に持ち、Keycloak に問い合わせずに検証する</text>

  <!-- JWKS arc -->
  <path d="M152,118 C152,66 808,66 808,116" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#teal)"/>
  <rect x="270" y="64" width="420" height="28" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="480" y="83" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">① JWKS で公開鍵だけを取得（初回・未知の kid のとき）</text>

  <!-- Keycloak -->
  <rect x="32" y="122" width="240" height="190" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <use href="#shield" x="50" y="134" width="34" height="42" fill="#7c3aed" stroke="#5b21b6"/>
  <text x="96" y="162" font-size="18" font-weight="700" fill="#4c1d95">Keycloak</text>
  <rect x="48" y="190" width="208" height="106" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <use href="#key" x="64" y="206" width="44" height="22" stroke="#b45309"/>
  <text x="120" y="224" font-size="16" font-weight="700" fill="#0f172a">秘密鍵</text>
  <text x="64" y="258" font-size="13" fill="#475569">JWT に署名する</text>
  <text x="64" y="280" font-size="13" fill="#475569">Keycloak の外に出さない</text>

  <!-- arrow 2 -->
  <path d="M276,218 L352,218" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <text x="314" y="206" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">② 発行</text>

  <!-- JWT -->
  <use href="#ticket" x="360" y="178" width="240" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="210" font-size="16" font-weight="700" fill="#1e3a8a">JWT（Access Token）</text>
  <text x="380" y="236" font-size="13" fill="#475569">sub / aud / exp ＋ 署名</text>
  <text x="480" y="284" font-size="13" fill="#64748b" text-anchor="middle">Web App が受け取り、Bearer で送る</text>

  <!-- arrow 3 -->
  <path d="M604,218 L682,218" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <text x="643" y="206" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">③ 送る</text>

  <!-- API -->
  <rect x="688" y="122" width="240" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <use href="#server" x="706" y="132" width="30" height="42" fill="#2563eb"/>
  <text x="750" y="162" font-size="18" font-weight="700" fill="#1e3a8a">Go API</text>
  <rect x="704" y="190" width="208" height="106" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <use href="#key" x="720" y="206" width="44" height="22" stroke="#0d9488"/>
  <text x="776" y="224" font-size="16" font-weight="700" fill="#0f172a">公開鍵</text>
  <text x="720" y="258" font-size="13" fill="#475569">メモリにキャッシュ</text>
  <text x="720" y="280" font-size="13" font-weight="700" fill="#0f766e">④ 手元で署名を検証</text>

  <!-- no per-request call -->
  <path d="M808,316 V352 H152 V322" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#light)"/>
  <g transform="translate(480,352)">
    <circle r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M-5.5,-5.5 L5.5,5.5 M5.5,-5.5 L-5.5,5.5" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="480" y="386" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">リクエストごとに「このトークンは有効か」と問い合わせない</text>

  <!-- footer -->
  <rect x="32" y="410" width="896" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="436" font-size="14" fill="#0f172a">公開鍵は署名の検証にしか使えず、署名は作れない。API に配ってもトークンを偽造されない</text>
</svg>
