<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>利用者はKeycloakでログインする。Keycloakはログイン画面・パスワード照合、ユーザー・ロール管理、SSO、トークンの発行と署名を引き受ける。Web Appはトークンを受け取ってセッションを管理し、Go APIへBearerトークンを送る。Go APIはトークン検証と業務の認可を行う</title>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <symbol id="shield" viewBox="0 0 40 48">
      <path d="M20,2 L38,9 V24 Q38,40 20,46 Q2,40 2,24 V9 Z" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="20" cy="20" r="5" fill="#ffffff" stroke="none"/>
      <path d="M17,23 H23 L22,33 H18 Z" fill="#ffffff" stroke="none"/>
    </symbol>
    <symbol id="server" viewBox="0 0 40 56">
      <rect x="0" y="0" width="40" height="16" rx="3"/>
      <rect x="0" y="20" width="40" height="16" rx="3"/>
      <rect x="0" y="40" width="40" height="16" rx="3"/>
      <circle cx="32" cy="8" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="28" r="2.5" fill="#ffffff" opacity="0.7"/><circle cx="32" cy="48" r="2.5" fill="#ffffff" opacity="0.7"/>
    </symbol>
    <symbol id="browser" viewBox="0 0 48 40">
      <rect x="1" y="1" width="46" height="38" rx="4" fill="#ffffff" stroke-width="2.5"/>
      <path d="M1,11 H47" fill="none" stroke-width="2.5"/>
      <circle cx="7" cy="6" r="1.8" stroke="none"/><circle cx="13" cy="6" r="1.8" stroke="none"/><circle cx="19" cy="6" r="1.8" stroke="none"/>
      <path d="M8,20 H30 M8,27 H38 M8,33 H24" fill="none" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </symbol>
    <symbol id="person" viewBox="0 0 48 48">
      <circle cx="24" cy="13" r="10"/>
      <path d="M4,46 Q4,26 24,26 Q44,26 44,46 Z"/>
    </symbol>
    <symbol id="check" viewBox="0 0 16 16">
      <path d="M3,8.5 l3.5,3.5 l6.5,-8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="409" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">ログインは Keycloak に任せ、アプリはトークンを検証する</text>

  <!-- User -->
  <rect x="32" y="96" width="120" height="204" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <use href="#person" x="68" y="134" width="48" height="48" fill="#64748b"/>
  <text x="92" y="214" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">利用者</text>
  <text x="92" y="236" font-size="13" fill="#64748b" text-anchor="middle">alice / bob</text>

  <!-- arrow 1 -->
  <path d="M156,198 L226,198" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <text x="192" y="186" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">① ログイン</text>

  <!-- Keycloak -->
  <rect x="232" y="96" width="280" height="204" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <use href="#shield" x="250" y="108" width="34" height="42" fill="#7c3aed" stroke="#5b21b6"/>
  <text x="296" y="136" font-size="18" font-weight="700" fill="#4c1d95">Keycloak</text>
  <use href="#check" x="252" y="166" width="16" height="16" stroke="#7c3aed"/>
  <text x="276" y="179" font-size="14" fill="#0f172a">ログイン画面・パスワード照合</text>
  <use href="#check" x="252" y="196" width="16" height="16" stroke="#7c3aed"/>
  <text x="276" y="209" font-size="14" fill="#0f172a">ユーザー・ロール管理</text>
  <use href="#check" x="252" y="226" width="16" height="16" stroke="#7c3aed"/>
  <text x="276" y="239" font-size="14" fill="#0f172a">SSO（複数アプリで共有）</text>
  <use href="#check" x="252" y="256" width="16" height="16" stroke="#7c3aed"/>
  <text x="276" y="269" font-size="14" fill="#0f172a">トークンの発行と署名</text>

  <!-- arrow 2 -->
  <path d="M516,198 L586,198" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <text x="552" y="186" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">② 発行</text>

  <!-- Web App -->
  <rect x="592" y="96" width="130" height="204" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <use href="#browser" x="633" y="114" width="48" height="40" fill="#059669" stroke="#059669"/>
  <text x="657" y="182" font-size="16" font-weight="700" fill="#064e3b" text-anchor="middle">Web App</text>
  <text x="657" y="202" font-size="13" fill="#475569" text-anchor="middle">A / B</text>
  <text x="657" y="246" font-size="13" fill="#0f172a" text-anchor="middle">セッション管理</text>

  <!-- arrow 3 -->
  <path d="M726,198 L784,198" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
  <text x="756" y="186" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">③ Bearer</text>

  <!-- API -->
  <rect x="790" y="96" width="138" height="204" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <use href="#server" x="843" y="110" width="32" height="45" fill="#2563eb"/>
  <text x="859" y="182" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Go API</text>
  <text x="859" y="202" font-size="13" fill="#475569" text-anchor="middle">A / B</text>
  <text x="859" y="246" font-size="13" fill="#0f172a" text-anchor="middle">トークン検証</text>
  <text x="859" y="268" font-size="13" fill="#0f172a" text-anchor="middle">業務の認可</text>

  <!-- brackets -->
  <path d="M232,312 V320 H512 V312" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="372" y="340" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Keycloak が引き受ける</text>
  <path d="M592,312 V320 H928 V312" stroke="#2563eb" stroke-width="2" fill="none"/>
  <text x="760" y="340" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">アプリ側に残る</text>

  <!-- footer -->
  <rect x="32" y="356" width="896" height="38" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="381" font-size="14" fill="#0f172a">パスワードは Keycloak だけが扱い、アプリには渡らない。アプリは届いたトークンを検証し、業務の認可を行う</text>
</svg>
