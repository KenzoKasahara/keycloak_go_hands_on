<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>同じaliceでもtokenはアプリごとに別。自分のAPIは200、別APIは401</title>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ng" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <symbol id="ticket" viewBox="0 0 220 80">
      <path d="M10,0 H210 A10,10 0 0 1 220,10 V30 A10,10 0 0 0 220,50 V70 A10,10 0 0 1 210,80 H10 A10,10 0 0 1 0,70 V50 A10,10 0 0 0 0,30 V10 A10,10 0 0 1 10,0 Z"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="499" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">tokenは宛先（aud）のAPIでだけ通る</text>

  <g transform="translate(0,40)">
    <!-- alice -->
    <circle cx="95" cy="180" r="62" fill="#fef9c3"/>
    <circle cx="95" cy="158" r="22" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <path d="M58,222 Q58,184 95,184 Q132,184 132,222 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <text x="95" y="270" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">alice</text>
    <rect x="45" y="282" width="100" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="95" y="301" font-size="14" fill="#334155" text-anchor="middle">sub は1つ</text>

    <!-- alice -> tokens -->
    <path d="M160,160 L226,105" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
    <path d="M160,200 L226,255" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>

    <!-- token A -->
    <use href="#ticket" x="230" y="60" width="220" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="268" y1="66" x2="268" y2="134" stroke="#2563eb" stroke-dasharray="4 4"/>
    <g stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"><circle cx="250" cy="100" r="6"/><path d="M256,100 H265 M261,100 v5 M265,100 v5"/></g>
    <text x="282" y="92" font-size="15" font-weight="700" fill="#1e3a8a">App A の Access Token</text>
    <rect x="282" y="102" width="112" height="26" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="338" y="120" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#1d4ed8" text-anchor="middle">aud = api-a</text>

    <!-- token B -->
    <use href="#ticket" x="230" y="220" width="220" height="80" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
    <line x1="268" y1="226" x2="268" y2="294" stroke="#059669" stroke-dasharray="4 4"/>
    <g stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"><circle cx="250" cy="260" r="6"/><path d="M256,260 H265 M261,260 v5 M265,260 v5"/></g>
    <text x="282" y="252" font-size="15" font-weight="700" fill="#064e3b">App B の Access Token</text>
    <rect x="282" y="262" width="112" height="26" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="338" y="280" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#047857" text-anchor="middle">aud = api-b</text>

    <!-- API A -->
    <g>
      <rect x="720" y="52" width="150" height="96" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <rect x="738" y="70" width="40" height="16" rx="3" fill="#2563eb"/>
      <rect x="738" y="90" width="40" height="16" rx="3" fill="#2563eb"/>
      <rect x="738" y="110" width="40" height="16" rx="3" fill="#2563eb"/>
      <circle cx="770" cy="78" r="2.5" fill="#bfdbfe"/><circle cx="770" cy="98" r="2.5" fill="#bfdbfe"/><circle cx="770" cy="118" r="2.5" fill="#bfdbfe"/>
      <text x="826" y="98" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">API A</text>
      <text x="826" y="120" font-size="13" fill="#475569" text-anchor="middle">api-a 宛だけ</text>
    </g>
    <!-- API B -->
    <g>
      <rect x="720" y="212" width="150" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
      <rect x="738" y="230" width="40" height="16" rx="3" fill="#059669"/>
      <rect x="738" y="250" width="40" height="16" rx="3" fill="#059669"/>
      <rect x="738" y="270" width="40" height="16" rx="3" fill="#059669"/>
      <circle cx="770" cy="238" r="2.5" fill="#a7f3d0"/><circle cx="770" cy="258" r="2.5" fill="#a7f3d0"/><circle cx="770" cy="278" r="2.5" fill="#a7f3d0"/>
      <text x="826" y="258" font-size="18" font-weight="700" fill="#064e3b" text-anchor="middle">API B</text>
      <text x="826" y="280" font-size="13" fill="#475569" text-anchor="middle">api-b 宛だけ</text>
    </g>

    <!-- own API: 200 -->
    <path d="M455,92 L714,92" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
    <path d="M455,268 L714,268" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
    <!-- other API: 401 -->
    <path d="M455,118 L714,246" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#ng)"/>
    <path d="M455,242 L714,114" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#ng)"/>

    <!-- badges -->
    <g transform="translate(540,92)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M-28,0 l6,6 l11,-12" stroke="#16a34a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="6" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">200</text>
    </g>
    <g transform="translate(540,268)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M-28,0 l6,6 l11,-12" stroke="#16a34a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="6" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">200</text>
    </g>
    <g transform="translate(655,217)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <path d="M-30,-7 l12,12 M-18,-7 l-12,12" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
      <text x="12" y="6" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">401</text>
    </g>
    <g transform="translate(655,143)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <path d="M-30,-7 l12,12 M-18,-7 l-12,12" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
      <text x="12" y="6" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">401</text>
    </g>

    <!-- legend -->
    <g transform="translate(230,360)">
      <rect x="0" y="0" width="640" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <line x1="24" y1="26" x2="84" y2="26" stroke="#16a34a" stroke-width="3" marker-end="url(#ok)"/>
      <text x="98" y="31" font-size="15" fill="#0f172a">自分のAPIへ送る → 受け付ける（HTTP 200）</text>
      <line x1="24" y1="54" x2="84" y2="54" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ng)"/>
      <text x="98" y="59" font-size="15" fill="#0f172a">「別APIへ同じトークン」→ audが違うので拒否（HTTP 401）</text>
    </g>
  </g>
</svg>
