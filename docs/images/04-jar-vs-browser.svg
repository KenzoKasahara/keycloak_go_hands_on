<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>browser_test.py（Cookie jar）で確かめるのはログインとSSO、トークン更新、ログアウト。実ブラウザでしか確かめられないのはSameSiteの扱い、CSPの適用、Referrer-PolicyとOrigin、画面の見た目</title>
  <defs>
    <symbol id="window" viewBox="0 0 48 40">
      <rect x="1.5" y="1.5" width="45" height="37" rx="4" fill="#ffffff" stroke-width="2.5"/>
      <path d="M1.5,12 H46.5" stroke-width="2.5" fill="none"/>
      <circle cx="8" cy="7" r="1.8" stroke="none"/><circle cx="14" cy="7" r="1.8" stroke="none"/><circle cx="20" cy="7" r="1.8" stroke="none"/>
    </symbol>
    <symbol id="check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11"/>
      <path d="M7,12.5 L10.5,16 L17,8.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="329" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">自動試験で確かめられる範囲と、実ブラウザが必要な範囲</text>

  <!-- left -->
  <rect x="32" y="70" width="436" height="236" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <g transform="translate(72,108)">
    <circle r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <circle cx="-8" cy="-7" r="3.2" fill="#78350f"/><circle cx="7" cy="-9" r="2.7" fill="#78350f"/><circle cx="8" cy="7" r="3.2" fill="#78350f"/><circle cx="-6" cy="9" r="2.7" fill="#78350f"/>
  </g>
  <text x="108" y="104" font-size="16" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#0f172a">browser_test.py</text>
  <text x="108" y="124" font-size="13" fill="#92400e">Cookie jar で確かめる</text>
  <g font-size="15" fill="#0f172a">
    <rect x="52" y="148" width="396" height="42" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <use href="#check" x="66" y="157" width="24" height="24" fill="#d97706"/>
    <text x="102" y="175">ログインと SSO</text>
    <rect x="52" y="198" width="396" height="42" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <use href="#check" x="66" y="207" width="24" height="24" fill="#d97706"/>
    <text x="102" y="225">トークン更新</text>
    <rect x="52" y="248" width="396" height="42" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <use href="#check" x="66" y="257" width="24" height="24" fill="#d97706"/>
    <text x="102" y="275">ログアウト</text>
  </g>

  <!-- right -->
  <rect x="492" y="70" width="436" height="236" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <use href="#window" x="508" y="88" width="48" height="40" fill="#7c3aed" stroke="#7c3aed"/>
  <text x="568" y="104" font-size="16" font-weight="700" fill="#0f172a">実ブラウザ</text>
  <text x="568" y="124" font-size="13" fill="#5b21b6">実ブラウザでしか確かめられない</text>
  <g font-size="15" fill="#0f172a">
    <rect x="512" y="140" width="396" height="36" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
    <use href="#check" x="526" y="146" width="24" height="24" fill="#7c3aed"/>
    <text x="562" y="164">SameSite の扱い</text>
    <rect x="512" y="182" width="396" height="36" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
    <use href="#check" x="526" y="188" width="24" height="24" fill="#7c3aed"/>
    <text x="562" y="206">CSP の適用</text>
    <rect x="512" y="224" width="396" height="36" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
    <use href="#check" x="526" y="230" width="24" height="24" fill="#7c3aed"/>
    <text x="562" y="248">Referrer-Policy と Origin</text>
    <rect x="512" y="266" width="396" height="36" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
    <use href="#check" x="526" y="272" width="24" height="24" fill="#7c3aed"/>
    <text x="562" y="290">画面の見た目</text>
  </g>
</svg>
