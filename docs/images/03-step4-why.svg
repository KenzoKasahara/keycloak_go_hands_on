<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>AとBで共有されるものと、アプリごとに別になるもの</title>
  <rect x="0.5" y="0.5" width="899" height="469" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">共有するのはログイン状態だけ。tokenはアプリごとに別</text>

  <!-- Shared panel -->
  <rect x="24" y="68" width="300" height="378" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="24" y="68" width="300" height="48" rx="14" fill="#f59e0b"/>
  <rect x="24" y="100" width="300" height="16" fill="#f59e0b"/>
  <text x="174" y="99" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A と B で共有</text>

  <!-- cookie -->
  <g transform="translate(70,170)">
    <circle r="26" fill="#d6a76a" stroke="#92400e" stroke-width="2"/>
    <circle cx="-9" cy="-8" r="4" fill="#78350f"/><circle cx="8" cy="-10" r="3" fill="#78350f"/>
    <circle cx="10" cy="7" r="4" fill="#78350f"/><circle cx="-7" cy="10" r="3" fill="#78350f"/>
  </g>
  <text x="112" y="164" font-size="16" font-weight="700" fill="#0f172a">Keycloakのログイン状態</text>
  <text x="112" y="188" font-size="14" fill="#475569">SSO Cookie</text>

  <!-- id card -->
  <g transform="translate(70,270)">
    <rect x="-28" y="-20" width="56" height="40" rx="6" fill="#ffffff" stroke="#92400e" stroke-width="2"/>
    <circle cx="-12" cy="-3" r="7" fill="#fbbf24"/>
    <path d="M-22,13 Q-22,4 -12,4 Q-2,4 -2,13 Z" fill="#fbbf24"/>
    <line x1="4" y1="-8" x2="20" y2="-8" stroke="#92400e" stroke-width="2.5"/>
    <line x1="4" y1="1" x2="20" y2="1" stroke="#92400e" stroke-width="2.5"/>
    <line x1="4" y1="10" x2="15" y2="10" stroke="#92400e" stroke-width="2.5"/>
  </g>
  <text x="112" y="264" font-size="16" font-weight="700" fill="#0f172a">ユーザー sub</text>
  <text x="112" y="288" font-size="14" fill="#475569">A でも B でも同じ値</text>

  <!-- role tag -->
  <g transform="translate(70,370)">
    <path d="M-26,-16 H10 L28,0 L10,16 H-26 Z" fill="#ffffff" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="10" cy="0" r="4" fill="#92400e"/>
    <text x="-9" y="5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">役</text>
  </g>
  <text x="112" y="364" font-size="16" font-weight="700" fill="#0f172a">Realm roles</text>
  <text x="112" y="388" font-size="14" fill="#475569">admin / user</text>

  <!-- Per-app panel -->
  <rect x="348" y="68" width="528" height="378" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="348" y="68" width="528" height="48" rx="14" fill="#64748b"/>
  <rect x="348" y="100" width="528" height="16" fill="#64748b"/>
  <text x="612" y="99" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">アプリごとに別</text>

  <!-- column headers -->
  <rect x="600" y="132" width="126" height="34" rx="8" fill="#2563eb"/>
  <text x="663" y="155" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">App A</text>
  <rect x="736" y="132" width="126" height="34" rx="8" fill="#059669"/>
  <text x="799" y="155" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">App B</text>

  <g font-size="15">
    <!-- row 1 -->
    <text x="368" y="200" fill="#0f172a" font-weight="700">client_id</text>
    <rect x="600" y="180" width="126" height="32" rx="6" fill="#dbeafe"/>
    <text x="663" y="201" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'Courier New',monospace">web-a</text>
    <rect x="736" y="180" width="126" height="32" rx="6" fill="#d1fae5"/>
    <text x="799" y="201" fill="#047857" text-anchor="middle" font-family="Consolas,'Courier New',monospace">web-b</text>
    <line x1="364" y1="222" x2="862" y2="222" stroke="#e2e8f0"/>
    <!-- row 2 -->
    <text x="368" y="250" fill="#0f172a" font-weight="700">state・nonce・PKCE</text>
    <rect x="600" y="230" width="126" height="32" rx="6" fill="#dbeafe"/>
    <text x="663" y="251" fill="#1d4ed8" text-anchor="middle">A 用の値</text>
    <rect x="736" y="230" width="126" height="32" rx="6" fill="#d1fae5"/>
    <text x="799" y="251" fill="#047857" text-anchor="middle">B 用の値</text>
    <line x1="364" y1="272" x2="862" y2="272" stroke="#e2e8f0"/>
    <!-- row 3 -->
    <text x="368" y="300" fill="#0f172a" font-weight="700">認可コード</text>
    <rect x="600" y="280" width="126" height="32" rx="6" fill="#dbeafe"/>
    <text x="663" y="301" fill="#1d4ed8" text-anchor="middle">A 用のコード</text>
    <rect x="736" y="280" width="126" height="32" rx="6" fill="#d1fae5"/>
    <text x="799" y="301" fill="#047857" text-anchor="middle">B 用のコード</text>
    <line x1="364" y1="322" x2="862" y2="322" stroke="#e2e8f0"/>
    <!-- row 4 -->
    <text x="368" y="350" fill="#0f172a" font-weight="700">Access Token の aud</text>
    <rect x="600" y="330" width="126" height="32" rx="6" fill="#dbeafe"/>
    <text x="663" y="351" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'Courier New',monospace">api-a</text>
    <rect x="736" y="330" width="126" height="32" rx="6" fill="#d1fae5"/>
    <text x="799" y="351" fill="#047857" text-anchor="middle" font-family="Consolas,'Courier New',monospace">api-b</text>
    <line x1="364" y1="372" x2="862" y2="372" stroke="#e2e8f0"/>
    <!-- row 5 -->
    <text x="368" y="400" fill="#0f172a" font-weight="700">Webセッション Cookie</text>
    <rect x="600" y="380" width="126" height="32" rx="6" fill="#dbeafe"/>
    <text x="663" y="401" fill="#1d4ed8" text-anchor="middle">A のセッション</text>
    <rect x="736" y="380" width="126" height="32" rx="6" fill="#d1fae5"/>
    <text x="799" y="401" fill="#047857" text-anchor="middle">B のセッション</text>
  </g>
</svg>
