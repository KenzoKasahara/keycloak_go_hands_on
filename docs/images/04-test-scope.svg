<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <title>テストの範囲。Go test/httptestは偽JWKS、テスト用RSA鍵、Repository fakeでclaims、JWKS、認可、PKCE、CSRFを確認する。verify.pyは実サービスでaudience、RBAC、実DB所有者を確認する。browser_test.pyはCookie jarでSSO、更新、ログアウトのプロトコルを確認する。実ブラウザはChapter 03の手順でOrigin、SameSite、CSP、画面を確認する</title>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <symbol id="window" viewBox="0 0 48 40">
      <rect x="1.5" y="1.5" width="45" height="37" rx="4" fill="#ffffff" stroke-width="2.5"/>
      <path d="M1.5,12 H46.5" stroke-width="2.5" fill="none"/>
      <circle cx="8" cy="7" r="1.8" stroke="none"/><circle cx="14" cy="7" r="1.8" stroke="none"/><circle cx="20" cy="7" r="1.8" stroke="none"/>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">4種類のテストで、確かめる範囲を分担する</text>
  <text x="32" y="72" font-size="13" font-weight="700" fill="#64748b">テスト手段</text>
  <text x="362" y="72" font-size="13" font-weight="700" fill="#64748b">確かめること</text>

  <!-- row 1: Go test -->
  <g transform="translate(0,84)">
    <rect x="32" y="0" width="276" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <g transform="translate(48,15)">
      <rect width="40" height="40" rx="8" fill="#0891b2"/>
      <path d="M14,13 L7,20 L14,27 M26,13 L33,20 L26,27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="102" y="30" font-size="15" font-weight="700" fill="#0f172a">Go test / httptest</text>
    <text x="102" y="52" font-size="12" fill="#475569">偽JWKS・テスト用RSA鍵・fake</text>
    <path d="M312,35 L350,35" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
    <rect x="356" y="0" width="572" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="13" font-weight="700" fill="#155e75" text-anchor="middle">
      <rect x="372" y="21" width="80" height="28" rx="14" fill="#cffafe"/><text x="412" y="40">claims</text>
      <rect x="462" y="21" width="80" height="28" rx="14" fill="#cffafe"/><text x="502" y="40">JWKS</text>
      <rect x="552" y="21" width="64" height="28" rx="14" fill="#cffafe"/><text x="584" y="40">認可</text>
      <rect x="626" y="21" width="72" height="28" rx="14" fill="#cffafe"/><text x="662" y="40">PKCE</text>
      <rect x="708" y="21" width="72" height="28" rx="14" fill="#cffafe"/><text x="744" y="40">CSRF</text>
    </g>
  </g>

  <!-- row 2: verify.py -->
  <g transform="translate(0,166)">
    <rect x="32" y="0" width="276" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <g transform="translate(48,15)">
      <rect width="40" height="40" rx="8" fill="#2563eb"/>
      <path d="M10,21 L17,28 L30,13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="102" y="30" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#0f172a">verify.py</text>
    <text x="102" y="52" font-size="12" fill="#475569">起動中の実サービスへ送る</text>
    <path d="M312,35 L350,35" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
    <rect x="356" y="0" width="572" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">
      <rect x="372" y="21" width="96" height="28" rx="14" fill="#dbeafe"/><text x="420" y="40">audience</text>
      <rect x="478" y="21" width="72" height="28" rx="14" fill="#dbeafe"/><text x="514" y="40">RBAC</text>
      <rect x="560" y="21" width="112" height="28" rx="14" fill="#dbeafe"/><text x="616" y="40">実DB所有者</text>
    </g>
  </g>

  <!-- row 3: browser_test.py -->
  <g transform="translate(0,248)">
    <rect x="32" y="0" width="276" height="70" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <g transform="translate(68,35)">
      <circle r="20" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
      <circle cx="-7" cy="-6" r="3" fill="#78350f"/><circle cx="6" cy="-8" r="2.5" fill="#78350f"/><circle cx="7" cy="6" r="3" fill="#78350f"/><circle cx="-5" cy="8" r="2.5" fill="#78350f"/>
    </g>
    <text x="102" y="30" font-size="15" font-weight="700" font-family="Consolas,'Courier New',monospace" fill="#0f172a">browser_test.py</text>
    <text x="102" y="52" font-size="12" fill="#475569">Cookie jar でブラウザを模擬</text>
    <path d="M312,35 L350,35" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
    <rect x="356" y="0" width="572" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">
      <rect x="372" y="21" width="64" height="28" rx="14" fill="#fef3c7"/><text x="404" y="40">SSO</text>
      <rect x="446" y="21" width="64" height="28" rx="14" fill="#fef3c7"/><text x="478" y="40">更新</text>
      <rect x="520" y="21" width="92" height="28" rx="14" fill="#fef3c7"/><text x="566" y="40">ログアウト</text>
    </g>
    <text x="626" y="40" font-size="13" fill="#64748b">のプロトコル</text>
  </g>

  <!-- row 4: real browser -->
  <g transform="translate(0,330)">
    <rect x="32" y="0" width="276" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <use href="#window" x="48" y="15" width="46" height="39" fill="#7c3aed" stroke="#7c3aed"/>
    <text x="108" y="30" font-size="15" font-weight="700" fill="#0f172a">実ブラウザ</text>
    <text x="108" y="52" font-size="12" fill="#475569">Chapter 03 の手順</text>
    <path d="M312,35 L350,35" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#gray)"/>
    <rect x="356" y="0" width="572" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">
      <rect x="372" y="21" width="76" height="28" rx="14" fill="#ede9fe"/><text x="410" y="40">Origin</text>
      <rect x="458" y="21" width="96" height="28" rx="14" fill="#ede9fe"/><text x="506" y="40">SameSite</text>
      <rect x="564" y="21" width="64" height="28" rx="14" fill="#ede9fe"/><text x="596" y="40">CSP</text>
      <rect x="638" y="21" width="64" height="28" rx="14" fill="#ede9fe"/><text x="670" y="40">画面</text>
    </g>
  </g>
</svg>
